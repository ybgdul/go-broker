syntax = "proto3";

package broker.v1;

option go_package = "github.com/ybgdul/go-broker/gen/v1;brokerv1";

service EventBrokerService { 
    rpc PublishStream(stream PublishRequest) returns (stream PublishAck);
    rpc SubscribeStream(SubscribeRequest) returns (stream EventEnvelope);
    rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionRequest);

}

enum Strategy { 
    DROP_NEWEST = 0;
    DROP_OLDEST = 1; 
}

message PublishRequest {
    string topic = 1;
    string key = 2;
    bytes payload = 3;
    map<string, string> headers = 4;
}

message PublicAck { 
    uint64 event_id = 1;
    bool success = 2;
    string error_message = 3;
}

message SubscribeRequest {
    string client_id = 1;
    repeated string topic_patterns = 2;
    Strategy backpressure = 3;
    uint32 queue_capacity = 4;
}

message EventEnvelope {
    uint64 event_id = 1;
    string topic = 2;
    string key = 3;
    bytes payload = 4;
    int64 timestamp_ns = 5;
    map<string, string> headers = 6;
}

message UpdateSubscriptionRequest { 
    string client_id = 1;
    repeated string add_patterns = 2;
    repeated string remove_patterns = 3; 
}

message UpdateSubscriptionResponse { 
    bool success = 1;
    repeated string active_patterns = 2;
}